<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — MAK RSS Reader</title>
<style>
  :root { --bg:#14161a; --panel:#1a1d23; --panel-2:#21252c; --line:#2b3038; --text:#e6e8ec; --muted:#8b929e; --accent:#f97316; --danger:#e5534b; --ok:#3fb950; }
  :root[data-theme="light"] { --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eef0f4; --line:#dcdfe6; --text:#1b1f27; --muted:#6b7280; --accent:#d9600c; --danger:#c9372c; --ok:#1a7f37; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif; }
  a { color: var(--accent); }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; }
  header h1 { font-size:16px; margin:0; }
  header .spacer { flex:1; }
  .wrap { max-width:1080px; margin:0 auto; padding:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  tr:last-child td { border-bottom:none; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:1px 7px; border:1px solid var(--line); border-radius:20px; font-size:11.5px; color:var(--muted); }
  .badge.admin { color:var(--accent); border-color:var(--accent); }
  .badge.off { color:var(--danger); border-color:var(--danger); }
  input, select { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; font-size:13.5px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .btn { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font:inherit; font-size:13.5px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { filter:brightness(1.08); color:#fff; }
  .btn.danger:hover { border-color:var(--danger); color:var(--danger); }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid-form { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap:10px; align-items:end; }
  label.field { display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted); }
  code { background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:12.5px; overflow-wrap:anywhere; }
  .msg { margin:10px 0 0; font-size:13px; min-height:18px; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .login { max-width:360px; margin:12vh auto; }
  .login .card { padding:22px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .actions .btn { padding:5px 9px; font-size:12.5px; }
  .key-cell { max-width:240px; }
  .stats { white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>MAK RSS Reader — админка</h1>
  <span class="spacer"></span>
  <span class="muted" id="who"></span>
  <a class="btn" href="/" id="to-reader">К читалке</a>
  <button class="btn" id="theme" title="Светлая/тёмная тема">◐</button>
  <button class="btn" id="logout" hidden>Выйти</button>
</header>

<div class="wrap">
  <!-- Вход -->
  <div class="login" id="login-box" hidden>
    <div class="card">
      <h2>Вход</h2>
      <div class="grid-form" style="grid-template-columns:1fr">
        <label class="field">Логин<input id="login-name" autocomplete="username" spellcheck="false"></label>
        <label class="field">Пароль<input id="login-pass" type="password" autocomplete="current-password"></label>
        <div class="row">
          <button class="btn primary" id="login-btn">Войти</button>
          <label class="muted" style="font-size:12.5px"><input type="checkbox" id="login-remember" checked> запомнить меня</label>
        </div>
      </div>
      <div class="msg err" id="login-msg"></div>
    </div>
  </div>

  <!-- Панель -->
  <div id="panel" hidden>
    <div class="card">
      <h2>Новый пользователь</h2>
      <div class="grid-form">
        <label class="field">Логин<input id="new-login" spellcheck="false" placeholder="например, makushin"></label>
        <label class="field">Пароль<input id="new-pass" type="text" spellcheck="false" placeholder="не короче 4 символов"></label>
        <label class="field">Роль
          <select id="new-role">
            <option value="user">пользователь</option>
            <option value="admin">администратор</option>
          </select>
        </label>
        <button class="btn primary" id="create-btn">Создать</button>
      </div>
      <div class="msg" id="create-msg"></div>
    </div>

    <div class="card">
      <h2>Пользователи</h2>
      <table>
        <thead>
          <tr>
            <th>Логин</th><th>Роль</th><th class="stats">Подписки</th><th class="stats">Статьи</th>
            <th class="stats">Непрочит.</th><th>Создан</th><th>Был</th><th class="key-cell">Ключ Fever</th><th>Действия</th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
      <div class="msg" id="users-msg"></div>
    </div>

    <div class="card">
      <h2>Подключение клиентов (Fever API)</h2>
      <div id="fever-info" class="muted"></div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
